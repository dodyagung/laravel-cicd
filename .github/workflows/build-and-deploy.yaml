name: Build and Deploy
permissions:
  contents: read
  packages: write

on: push

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge into multi-arch latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}:latest \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

  deploy:
    runs-on: ubuntu-26.04
    needs: manifest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Deploy to k8s with helm
        uses: WyriHaximus/github-action-helm3@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
          overrule_existing_kubeconfig: true
          exec: |
            helm upgrade ${{ github.event.repository.name }} helm-charts \
              --atomic \
              --debug \
              --history-max 2 \
              --install \
              --set-string image.tag="latest" \
              --set-string "env[0].name=APP_KEY" --set-string "env[0].value=${{ secrets.APP_KEY }}" \
              --set-string podAnnotations.deployedAt="$(TZ='Asia/Jakarta' date +'%Y-%m-%dT%H:%M:%S%z')" \
              --set-string podAnnotations.deployedBy="${{ github.actor }}" \
              --set-string podAnnotations.projectBranch="${{ github.ref_name }}" \
              --set-string podAnnotations.projectCommit="$(echo $GITHUB_SHA | cut -c1-7)" \
              --set-string podAnnotations.projectPath="${{ github.repository }}" \
              --wait
